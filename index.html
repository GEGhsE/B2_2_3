<title>'50까지의 수' 모험 - 수 읽고 쓰기</title>
<script>
// ── GAS 주소 결정 순서 ──
// 1) URL 해시에 #c= 가 있으면 → 학생용 링크 (선생님 공유 링크)
// 2) localStorage에 저장된 주소 → 선생님이 이전에 입력한 주소
// 3) 둘 다 없으면 → 체험 모드
(function() {
var hash = location.hash || '';
var m = hash.match(/[#&]c=([^&]+)/);
if (m) {
try {
var decoded = decodeURIComponent(m[1]);
window.__GAS_URL_FROM_HASH__ = decoded;
window.__IS_STUDENT_LINK__ = true;
} catch(e) {}
}
})();
function getGasUrl() {
if (window.__GAS_URL_FROM_HASH__) return window.__GAS_URL_FROM_HASH__;
try { return localStorage.getItem('gas_exec_url') || ''; } catch(e) { return ''; }
}
function setGasUrl(url) {
try { localStorage.setItem('gas_exec_url', url); } catch(e) {}
}
function isValidGasUrl(url) {
return url && typeof url === 'string' && url.startsWith('https://script.google.com');
}

<script>
function showError(title, detail) {
const box = document.getElementById('error-display');
box.style.display = 'block';
box.textContent = title + '\n\n' + detail;
}
window.addEventListener('error', function(e) {
showError('⚠️ JavaScript 오류',
(e.message || '') + '\n' +
(e.filename || '') + ' line ' + (e.lineno || '') + ':' + (e.colno || '') + '\n\n' +
(e.error && e.error.stack ? e.error.stack : ''));
});
window.addEventListener('unhandledrejection', function(e) {
showError('⚠️ Promise 오류',
(e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '\n\n' +
(e.reason && e.reason.stack ? e.reason.stack : ''));
});

if (root && root.children.length === 0) {

}, 20000);

clearInterval(__checkRendered);
}
}, 1000);

*/
async function callGas(action, data = {}) {
const GAS_WEB_APP_URL = getGasUrl();
if (!isValidGasUrl(GAS_WEB_APP_URL)) return null;
return new Promise((resolve, reject) => {
const callbackName = 'gas_callback_' + Math.round(Math.random() * 1000000);
const script = document.createElement('script');
const cleanup = () => {
delete window[callbackName];
if (script.parentNode) script.parentNode.removeChild(script);
};
const timeout = setTimeout(() => {
cleanup();
console.error("GAS 호출 시간 초과:", action);
resolve(null);
}, 15000);
window[callbackName] = response => {
clearTimeout(timeout);
cleanup();
resolve(response);
};
const url = new URL(GAS_WEB_APP_URL);
url.searchParams.append('action', action);
url.searchParams.append('callback', callbackName);
Object.keys(data).forEach(key => url.searchParams.append(key, data[key]));
script.src = url.toString();
script.onerror = () => {
clearTimeout(timeout);
cleanup();
console.error("GAS 스크립트 로드 실패:", action);
resolve(null);
};
document.body.appendChild(script);
});
}

const ten = Math.floor(n / 10) * 10,
unit = n % 10;
return {
id: `p2-${n}`,
phase: 2,
type: 'digit',
q: `${NUM_WORDS[ten].k}${K_UNITS[unit]}`,
tensPart: NUM_WORDS[ten].k,
unitsPart: K_UNITS[unit],
ans: [Math.floor(n / 10).toString(), (n % 10).toString()],
hint: `'${NUM_WORDS[ten].k}'은 십모형 ${Math.floor(n / 10)}개,\n'${K_UNITS[unit]}'은 낱개 ${unit}개를 의미해요.`
};
});
// 3단계: 수 읽기 (11~49 중 랜덤 3개, 매번 새로 무작위 선택)
const readPool = shuffle(Array.from({
length: 39
}, (_, i) => i + 11).filter(n => n % 10 !== 0)).slice(0, 3);
const p3 = [];
readPool.forEach(n => {
p3.push({
id: `p3a-${n}`,
phase: 3,
type: 'digit',
q: n,
ans: [Math.floor(n / 10).toString(), (n % 10).toString()],
hint: `십모형이 ${Math.floor(n / 10)}개, 낱개가 ${n % 10}개 있어요.\n어떤 숫자일까요?`
});
p3.push({
id: `p3-${n}`,
phase: 3,
type: 'read',
q: n,
ans: [NUM_WORDS[Math.floor(n / 10) * 10].k, K_UNITS[n % 10]],
hint: `십모형이 ${Math.floor(n / 10)}개, 낱개가 ${n % 10}개 있어요.\n어떻게 읽을까요?`
});
});
// 4단계: 우리말로 읽기 (랜덤 생성)
const pool = [];
for (let i = 11; i <= 50; i++) pool.push(i);
const stage4Numbers = shuffle(pool).slice(0, stage4Count);
const p4 = stage4Numbers.map(n => {
const native = getNativeReading(n);
const sinoTens = Math.floor(n / 10) === 1 ? '십' : S_ORDER[Math.floor(n / 10) - 1];
const sinoUnits = n % 10 > 0 ? S_UNITS[n % 10] : '';
const sino = sinoTens + sinoUnits;
return {
id: `p4-${n}`,
phase: 4,
type: 'voice',
q: n,
sinoReading: sino,
nativeReading: native,
correctReading: native,
// 정답 표시용 (우리말)
validReadings: [native],
// 우리말만 정답
blockHint: getBlockHint(n)
};
});
return {
1: p1,
2: p2,
3: p3,
4: p4
};
}

/* 5단계 전용: 랜덤 숫자 10개를 뽑아 digit/read 타입도 랜덤으로 섞어 출제 */
function buildStage5Problems(count = 10) {
  const shuffle = arr => {
    const result = [...arr];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  };
  const pool = shuffle(
    Array.from({ length: 39 }, (_, i) => i + 11).filter(n => n % 10 !== 0)
  );
  const numbers = pool.slice(0, count);
  return numbers.map(n => {
    const tens = Math.floor(n / 10);
    const units = n % 10;
    const type = Math.random() < 0.5 ? 'digit' : 'read';
    if (type === 'digit') {
      return {
        id: `p5-d-${n}`,
        phase: 3,
        type: 'digit',
        q: n,
        ans: [tens.toString(), units.toString()],
        hint: `십모형이 ${tens}개, 낱개가 ${units}개 있어요.\n어떤 숫자일까요?`
      };
    } else {
      return {
        id: `p5-r-${n}`,
        phase: 3,
        type: 'read',
        q: n,
        ans: [NUM_WORDS[tens * 10].k, K_UNITS[units]],
        hint: `십모형이 ${tens}개, 낱개가 ${units}개 있어요.\n어떻게 읽을까요?`
      };
    }
  });
}
